# Hosting estático en Netlify. La versión de Node sale de .node-version.
#
# Salida del build: React Router (ssr: false + prerender) escribe el sitio estático en build/client
# (`/` → index.html, `/en/` → en/index.html). build/server NO se publica.

[build]
command = "pnpm run build"
publish = "build/client"

# Previsualizaciones (deploy previews y branch deploys): nunca indexables.
# Netlify no admite cabeceras por contexto en [[headers]], así que se añade
# una regla al archivo `_headers` generado tras el build.
[context.deploy-preview]
command = "pnpm run build && printf '/*\\n  X-Robots-Tag: noindex\\n' >> build/client/_headers"

[context.branch-deploy]
command = "pnpm run build && printf '/*\\n  X-Robots-Tag: noindex\\n' >> build/client/_headers"

# URLs con barra final (política del proyecto, ver docs/ARCHITECTURE.md): cada página es `ruta/index.html`.
# NO se añade ninguna regla /en → /en/ ni /* → __spa-fallback.html:
#  - Se espera que Netlify redirija una carpeta sin barra final a la versión con barra (301) cuando existe
#    ruta/index.html; una regla propia para lo mismo puede provocar un bucle. NO verificado desde fuera de
#    Netlify: comprobar `curl -I <preview>/en` en la primera previsualización (ver docs/known-issues.md).
#  - La 404 real (estado 404, sin JavaScript) será un archivo build/client/404.html, que Netlify sirve solo
#    para las rutas que no existen. Se añade en la Fase 2B (ver docs/known-issues.md).

# Archivos con hash en el nombre: inmutables, caché de 1 año.
[[headers]]
for = "/assets/*"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

# Medios sin hash en el nombre: caché larga (30 días). Si se reemplaza un
# archivo, conviene renombrarlo para que no se sirva una copia antigua.
[[headers]]
for = "/video/*"
[headers.values]
Cache-Control = "public, max-age=2592000"

[[headers]]
for = "/slider/*"
[headers.values]
Cache-Control = "public, max-age=2592000"

[[headers]]
for = "/branding/*"
[headers.values]
Cache-Control = "public, max-age=2592000"
