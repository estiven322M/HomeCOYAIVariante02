# Hosting estático en Netlify.
#
# NOTA (Fase 2): hoy la salida del build es `dist`. Al adoptar React Router en
# modo framework con prerender, la carpeta pasará a ser `build/client`; entonces
# hay que actualizar `publish` aquí. Ver docs/ARCHITECTURE.md.

[build]
  command = "pnpm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Previsualizaciones (deploy previews y branch deploys): nunca indexables.
# Netlify no admite cabeceras por contexto en [[headers]], así que se añade
# una regla al archivo `_headers` generado tras el build.
[context.deploy-preview]
  command = "pnpm run build && printf '/*\n  X-Robots-Tag: noindex\n' >> dist/_headers"

[context.branch-deploy]
  command = "pnpm run build && printf '/*\n  X-Robots-Tag: noindex\n' >> dist/_headers"

# Archivos con hash en el nombre: inmutables, caché de 1 año.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Medios sin hash en el nombre: caché larga (30 días). Si se reemplaza un
# archivo, conviene renombrarlo para que no se sirva una copia antigua.
[[headers]]
  for = "/video/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/slider/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/branding/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"
